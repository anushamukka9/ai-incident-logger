[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-logger"
version = "0.1.0"
description = "Structured logging of AI incidents: records, severity lifecycle, near-duplicate detection, trend summaries, JSON export, and a CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Anusha Mukka" }]
keywords = ["ai-safety", "incident-response", "logging", "governance", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/ai-incident-logger"

[project.scripts]
ailog = "ai_incident_logger.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
